name: Security advisories

# Advisories are published against code that hasn't changed, so they are
# checked daily as well as on every change (the deny job in rust.yml). A
# failure here means a dependency needs bumping, usually `cargo update -p`.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: RustSec advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.19.4
      - working-directory: rust
        run: cargo deny --locked check advisories
