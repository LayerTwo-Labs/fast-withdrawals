name: Lint workflows and scripts

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Security audit of the workflows: template injection, credential
  # persistence, excessive permissions, unpinned or impostor actions.
  zizmor:
    name: Audit workflows (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: zizmor@1.31.1
      - name: zizmor
        env:
          # For the online audits (known-vulnerable and impostor actions).
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github .github

  shellcheck:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Preinstalled on GitHub's Ubuntu runners.
      - run: shellcheck rust/scripts/*.sh
