name: Rust Docker images

on:
  push:
    branches:
      - master
    paths:
      - rust/**
      - proto/**
      - .github/workflows/rust-docker.yml
  pull_request:
    paths:
      - rust/**
      - proto/**
      - .github/workflows/rust-docker.yml
  workflow_dispatch:

# Each job grants itself what it needs.
permissions: {}

concurrency:
  group: rust-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # GHCR refs must be lowercase.
  REGISTRY: ghcr.io/layertwo-labs
  # Fork PRs can't push to GHCR, so they only build.
  PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  # Each platform builds natively on its own runner (compiling Rust under
  # QEMU is too slow) and pushes by digest; `merge` stitches the digests into
  # one multi-arch tag per image.
  #
  # Each image comes in one variant per platform: the plain tag has no cloud
  # SDKs (PKCS#11 and local keys, eg. for bare metal); `-gcp` adds Google
  # Cloud KMS and verifying Cloud Scheduler's ID tokens.
  build:
    name: Build ${{ matrix.target }}${{ matrix.variant.suffix }} (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        target: [api, wallet]
        variant:
          - suffix: ""
            features: ""
          # Released feature sets; the lint job in rust.yml and `just test` lint
          # the same sets, so keep them in step.
          - suffix: -gcp
            features: fastwithdraw-api/gcp-kms fastwithdraw-api/gcp-auth fastwithdraw-wallet/gcp-kms
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Platform slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
      - name: Rust version
        id: rust-version
        run: echo "version=$(awk -F'"' '/^channel/{print $2}' rust/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and maybe push) by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: rust
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          build-args: |
            RUST_VERSION=${{ steps.rust-version.outputs.version }}
            FEATURES=${{ matrix.variant.features }}
          outputs: type=image,name=${{ env.REGISTRY }}/fastwithdraw-${{ matrix.target }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}
          cache-from: type=gha,scope=${{ matrix.target }}${{ matrix.variant.suffix }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}${{ matrix.variant.suffix }}-${{ env.PLATFORM_PAIR }}
      - name: Export digest
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.PUSH == 'true'
        with:
          name: digests-${{ matrix.target }}${{ matrix.variant.suffix }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  merge:
    name: Tag ${{ matrix.target }}${{ matrix.variant }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    strategy:
      matrix:
        target: [api, wallet]
        # The build matrix's variant suffixes.
        variant: ["", -gcp]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          # PLATFORM_PAIR starts with "linux-", so the plain variant's pattern
          # doesn't also match -gcp digests.
          pattern: digests-${{ matrix.target }}${{ matrix.variant }}-linux-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/fastwithdraw-${{ matrix.target }}
          flavor: suffix=${{ matrix.variant }},onlatest=true
          tags: |
            type=sha
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/fastwithdraw-${{ matrix.target }}
        run: |
          # One `-t` per tag, one ref per digest.
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          refs=()
          for digest in *; do refs+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
