[workspace]
resolver = "3"
members = ["alerts", "api", "integration_tests", "proto", "signer", "sweep", "thunder", "thunder_keys", "wallet"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "tracing"] }
bdk_esplora = { version = "0.22.2", default-features = false, features = ["async-https-rustls", "tokio"] }
bdk_wallet = { version = "3.2.0", features = ["std"] }
bip39 = { version = "2.2.0", features = ["zeroize"] }
base64 = "0.22"
bitcoin = { version = "0.32", features = ["base64", "rand-std"] }
blake3 = "1.8.2"
bs58 = "0.5.1"
buffa = { version = "0.9", features = ["json"] }
buffa-descriptor = { version = "0.9", features = ["reflect"] }
buffa-types = { version = "0.9", features = ["json", "reflect"] }
bytes = "1"
crc32c = "0.6"
cryptoki = "0.12.1"
clap = { version = "4.5", features = ["derive", "env"] }
connectrpc = "0.9"
connectrpc-reflection = "0.9"
curve25519-dalek = { version = "4.1.3", features = ["rand_core"] }
dotenvy = "0.15.7"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
futures = "0.3"
google-cloud-auth = "1"
google-cloud-gax = "1"
google-cloud-kms-v1 = "1"
hex = "0.4.3"
hmac = "0.12.1"
http = "1"
jsonwebtoken = "9.3"
libtest-mimic = "0.8.1"
parking_lot = "0.12"
postgresql_embedded = "0.20"
# The version thunder_types' signing takes.
rand = { version = "0.10", default-features = false, features = ["std", "thread_rng"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
reserve-port = "2.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
sqlx = { version = "0.9", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "tls-rustls"] }
toml = "1"
temp-dir = "0.1.16"
thiserror = "2"
# Thunder's types, for the sweep tool. The tag is also the Thunder release the
# integration tests run (scripts/setup_integration_tests.sh reads it from here).
thunder_types = { git = "https://github.com/LayerTwo-Labs/thunder-rust", tag = "v0.18.3" }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
webpki-roots = "1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

fastwithdraw-alerts = { path = "alerts" }
fastwithdraw-proto = { path = "proto" }
fastwithdraw-signer = { path = "signer" }
fastwithdraw-thunder = { path = "thunder" }
fastwithdraw-thunder-keys = { path = "thunder_keys" }
fastwithdraw-api = { path = "api" }
fastwithdraw-wallet = { path = "wallet" }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
print_stderr = "deny"
print_stdout = "deny"
wildcard_imports = "deny"

[workspace.lints.rust]
let_underscore_drop = "deny"
refining_impl_trait = { level = "allow", priority = -1 }
unfulfilled_lint_expectations = "deny"
